[project]
name = "event-prediction"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "feedparser>=6.0.14",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
event-prediction = "event_prediction:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# CPU-only torch on Linux (GitHub Actions): avoids ~2.5 GB of CUDA wheels every hourly run.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
